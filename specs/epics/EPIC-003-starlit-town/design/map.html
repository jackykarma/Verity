<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星光小镇 · 地图导航</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    .map-page {
      min-height: 100vh;
      background: linear-gradient(180deg, #E8F5EE 0%, #F0EDF5 50%, #FFF8E8 100%);
      padding: 24px;
    }
    .map-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .map-title { font-size: 1.25rem; font-weight: 700; color: var(--color-night); margin: 0 0 4px 0; }
    .map-phase {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--color-white);
      border-radius: var(--radius-full);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-primary);
      box-shadow: var(--shadow-sm);
      margin-top: 8px;
    }
    .map-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 420px;
      margin: 0 auto 24px;
    }
    @media (min-width: 520px) {
      .map-grid { grid-template-columns: repeat(3, 1fr); max-width: 520px; }
    }
    .map-spot {
      aspect-ratio: 1;
      border-radius: var(--radius-xl);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
      font-weight: 600;
      font-size: 0.9375rem;
      transition: transform var(--transition-normal), box-shadow var(--transition-normal);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }
    .map-spot:active { transform: scale(0.98); }
    .map-spot:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    .map-spot-icon { font-size: 2.25rem; margin-bottom: 8px; }
    .map-spot span { text-align: center; padding: 0 8px; }
    .map-spot-home { background: linear-gradient(145deg, #FFF5EE 0%, #FFE8DC 100%); }
    .map-spot-school { background: linear-gradient(145deg, #E3F2FD 0%, #BBDEFB 100%); }
    .map-spot-park { background: linear-gradient(145deg, #E8F5E9 0%, #C8E6C9 100%); }
    .map-spot-shop { background: linear-gradient(145deg, #FCE4EC 0%, #F8BBD9 100%); }
    .map-spot-forest { background: linear-gradient(145deg, #E8F5EE 0%, #A5D6A7 100%); }
    .map-bottom {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .map-bottom .btn { flex: 1; min-width: 140px; }
  </style>
</head>
<body>
  <div class="map-page">
    <div class="map-header">
      <h1 class="map-title">星光小镇</h1>
      <p class="page-subtitle">点击地点前往</p>
      <div class="map-phase">☀️ 白天</div>
    </div>
    <div class="map-grid">
      <a href="home.html" class="map-spot map-spot-home">
        <span class="map-spot-icon">🏠</span>
        <span>家</span>
        <span style="font-size:0.75rem;font-weight:400;color:var(--color-gray-600)">卧室·衣柜·宠物角</span>
      </a>
      <a href="#school" class="map-spot map-spot-school">
        <span class="map-spot-icon">🏫</span>
        <span>学校</span>
        <span style="font-size:0.75rem;font-weight:400;color:var(--color-gray-600)">上课·小游戏</span>
      </a>
      <a href="#park" class="map-spot map-spot-park">
        <span class="map-spot-icon">🌳</span>
        <span>公园</span>
        <span style="font-size:0.75rem;font-weight:400;color:var(--color-gray-600)">交朋友·喂动物</span>
      </a>
      <a href="#shop" class="map-spot map-spot-shop">
        <span class="map-spot-icon">🛍️</span>
        <span>商店</span>
        <span style="font-size:0.75rem;font-weight:400;color:var(--color-gray-600)">服装·文具·装饰</span>
      </a>
      <a href="#forest" class="map-spot map-spot-forest" style="grid-column: 1 / -1; max-width: 200px; margin: 0 auto; aspect-ratio: 1.2;">
        <span class="map-spot-icon">🌲</span>
        <span>神秘森林</span>
        <span style="font-size:0.75rem;font-weight:400;color:var(--color-gray-600)">轻探索</span>
      </a>
    </div>
    <div class="map-bottom">
      <button type="button" class="btn btn-ghost">早上选衣服</button>
      <button type="button" class="btn btn-primary">今天的故事</button>
    </div>
    <div class="nav-links" style="margin-top:20px">
      <a href="entry.html">← 游戏入口</a>
      <a href="morning.html">早上选衣 →</a>
    </div>
  </div>
</body>
</html>
