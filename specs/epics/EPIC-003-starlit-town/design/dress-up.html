<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星光小镇 · 装扮</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    .dress-page { max-width: 420px; margin: 0 auto; padding: 24px; min-height: 100vh; background: var(--color-primary-bg); }
    .dress-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .dress-back { color: var(--color-primary); text-decoration: none; font-weight: 600; }
    .dress-title { font-size: 1.25rem; font-weight: 700; color: var(--color-night); margin: 0; }
    .dress-preview {
      height: 200px; background: linear-gradient(180deg, #FFF 0%, #F5F0FA 100%);
      border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; box-shadow: var(--shadow-sm);
    }
    .dress-preview .avatar { font-size: 5rem; }
    .dress-categories { margin-bottom: 20px; }
    .dress-categories h3 { font-size: 0.875rem; color: var(--color-gray-600); margin: 0 0 10px 0; font-weight: 600; }
    .dress-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .dress-tab {
      padding: 8px 14px; border-radius: var(--radius-full); border: none;
      background: var(--color-white); color: var(--color-gray-600); font-family: inherit; font-weight: 600; font-size: 0.875rem;
      cursor: pointer; transition: background var(--transition-fast), color var(--transition-fast);
    }
    .dress-tab.active { background: var(--color-primary); color: var(--color-white); }
    .dress-tab:hover:not(.active) { background: var(--color-gray-100); }
    .dress-options { display: flex; gap: 10px; flex-wrap: wrap; }
    .dress-option {
      width: 64px; height: 64px; border-radius: var(--radius-md); border: 2px solid var(--color-gray-100);
      background: var(--color-white); font-size: 1.75rem; cursor: pointer;
      transition: border-color var(--transition-fast), transform var(--transition-fast);
    }
    .dress-option:hover { border-color: var(--color-primary-light); transform: scale(1.03); }
    .dress-option.selected { border-color: var(--color-primary); background: var(--color-primary-bg); }
    .dress-styles { margin-top: 24px; }
    .dress-styles h3 { font-size: 0.875rem; color: var(--color-gray-600); margin: 0 0 10px 0; font-weight: 600; }
    .dress-styles .tag { margin-right: 8px; margin-bottom: 8px; cursor: pointer; }
    .dress-actions { display: flex; gap: 12px; margin-top: 24px; }
    .dress-actions .btn { flex: 1; }
  </style>
</head>
<body>
  <div class="dress-page">
    <div class="dress-header">
      <a href="home.html" class="dress-back">← 家</a>
      <h1 class="dress-title">👗 装扮</h1>
      <span style="width:48px"></span>
    </div>
    <div class="dress-preview">
      <span class="avatar" aria-hidden="true">👧</span>
    </div>
    <div class="dress-categories">
      <h3>选择品类</h3>
      <div class="dress-tabs">
        <button type="button" class="dress-tab active">发型</button>
        <button type="button" class="dress-tab">裙子</button>
        <button type="button" class="dress-tab">鞋子</button>
        <button type="button" class="dress-tab">背包</button>
      </div>
      <div class="dress-options" style="margin-top:14px">
        <button type="button" class="dress-option selected">👧</button>
        <button type="button" class="dress-option">👩</button>
        <button type="button" class="dress-option">🧒</button>
        <button type="button" class="dress-option">👱‍♀️</button>
      </div>
    </div>
    <div class="dress-styles">
      <h3>风格标签（无属性）</h3>
      <span class="tag tag-sweet">甜甜</span>
      <span class="tag tag-cool">酷酷</span>
      <span class="tag tag-forest">森林</span>
      <span class="tag tag-star">星星</span>
    </div>
    <div class="dress-actions">
      <a href="dress-design.html" class="btn btn-secondary">设计裙子</a>
      <button type="button" class="btn btn-primary">完成</button>
    </div>
    <div class="nav-links" style="margin-top:24px">
      <a href="home.html">← 家</a>
      <a href="room-pet.html">房间·宠物 →</a>
    </div>
  </div>
</body>
</html>
